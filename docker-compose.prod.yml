# SYNORA production deployment (Docker Compose).
#
# Differences from the dev docker-compose.yml:
#   - NO host ports for postgres / minio / backend / frontend: the ONLY public
#     entrance is Caddy (80/443), which terminates TLS (Let's Encrypt) and routes
#     /api/* + /files/* to the backend, /uploads/* to the MinIO bucket, and
#     everything else to the frontend.
#   - APP_ENV=prod: the backend refuses a default JWT secret, API docs are
#     hidden, refresh cookies require Secure.
#   - Telegram runs in WEBHOOK mode (TELEGRAM_POLLING=false): on every start the
#     backend re-registers each connected bot at https://$DOMAIN.
#   - Every service restarts on failure/reboot and has bounded log files.
#   - A backup sidecar dumps the database AND the uploaded images every day.
#
# First deploy (see docs/DEPLOY.md for the full walkthrough):
#   scripts/gen-env.sh yourdomain.uz            # writes .env.prod with fresh secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Secrets live in .env.prod on the server only — never commit it.

name: synora-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports:` — the DB is reachable only on the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [synora]

  backup:
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}   # daily
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups_data:/backups
      - minio_data:/minio-data:ro      # uploaded images are part of the backup
    depends_on:
      postgres:
        condition: service_healthy
    networks: [synora]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      DEBUG: "false"                       # docs hidden, no traceback leakage
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-synora-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-synora}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_PATH_STYLE: "true"
      # Same-origin, relative URLs (Caddy serves /uploads/* from MinIO). They
      # are identical to the dev setup, so a database restored from a PC keeps
      # working images with no rewriting.
      S3_PUBLIC_URL_BASE: /uploads
      PAYME_IS_TEST: ${PAYME_IS_TEST:-false}
      REFRESH_COOKIE_SECURE: "true"
      TELEGRAM_POLLING: "false"            # webhook mode (needs the https domain)
      # Explicit, so they follow --env-file even if env_file ever differs.
      SYNORA_PAYMENT_CARD: ${SYNORA_PAYMENT_CARD:-}
      SYNORA_PAYMENT_HOLDER: ${SYNORA_PAYMENT_HOLDER:-}
    # No `ports:` — Caddy is the only door into the backend.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [synora]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *logging
    # Internal only; /uploads on the public edge is proxied by Caddy.
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [synora]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set download local/$${S3_BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-synora-uploads}
    restart: "no"
    networks: [synora]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://backend:8000   # rewrites are baked at build time
        MINIO_URL: http://minio:9000
    restart: unless-stopped
    logging: *logging
    environment:
      API_URL: http://backend:8000
      # Rebrand the /waiter PWA for this client deployment — see
      # docker-compose.yml for details.
      WAITER_APP_NAME: ${WAITER_APP_NAME:-}
      WAITER_APP_SHORT_NAME: ${WAITER_APP_SHORT_NAME:-}
      WAITER_APP_THEME_COLOR: ${WAITER_APP_THEME_COLOR:-}
    depends_on:
      backend:
        condition: service_healthy
    networks: [synora]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    # The only public ports. Caddy obtains + renews Let's Encrypt certificates
    # and stores them in the caddy_data volume.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}                       # e.g. synora.example.uz
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [synora]

networks:
  synora:
    driver: bridge

volumes:
  postgres_data:
  backups_data:
  minio_data:
  caddy_data:
  caddy_config:
