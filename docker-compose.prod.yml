# SYNORA production deployment (Docker Compose).
#
# Differences from the dev docker-compose.yml:
#   - NO host port for postgres: the database is reachable only on the compose
#     network (backup sidecar + backend only).
#   - NO host port for backend/frontend: ALL public traffic enters through
#     Caddy, which terminates TLS (Let's Encrypt) and routes /api/* + /files/*
#     to the backend and everything else to the frontend.
#   - Uploads go to MinIO (S3-compatible); the backend never serves files.
#   - APP_ENV=prod: the backend refuses a default JWT secret, the docs are
#     hidden, refresh cookies require Secure.
#
# Deploy:  cp .env.prod.example .env.prod &&  # fill secrets
#          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Secrets: store in your VM env / secret manager; do NOT commit .env.prod.
#
# DNS: point your A record (and 'api.' if split) at this host, then Caddy
# auto-provisions certificates (no certbot, no open firewall ports beyond 80/443).

name: synora-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports:` — the DB is internal-only in production.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [synora]

  backup:
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}   # daily
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [synora]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      DEBUG: "false"                       # docs hidden, no traceback leakage
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-synora-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-synora}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_PATH_STYLE: "true"
      S3_PUBLIC_URL_BASE: ${PUBLIC_APP_URL}/images
      PAYME_IS_TEST: ${PAYME_IS_TEST:-false}
      REFRESH_COOKIE_SECURE: "true"
    # No `ports:` — Caddy is the only door into the backend.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [synora]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # Internal only; /images on the public edge is proxied from Caddy.
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [synora]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set download local/$${S3_BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-synora-uploads}
    restart: "no"
    networks: [synora]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://backend:8000   # rewrites are baked at build time
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      # Rebrand the /waiter PWA for this client deployment — see
      # docker-compose.yml for details.
      WAITER_APP_NAME: ${WAITER_APP_NAME:-}
      WAITER_APP_SHORT_NAME: ${WAITER_APP_SHORT_NAME:-}
      WAITER_APP_THEME_COLOR: ${WAITER_APP_THEME_COLOR:-}
    depends_on:
      backend:
        condition: service_healthy
    networks: [synora]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only public ports. Caddy obtains + renews Let's Encrypt certs via the
    # volume (wire it to a durable disk on the VM).
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}                       # e.g. synora.example.com
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend: { condition: service_healthy }
      minio:
        condition: service_started
    networks: [synora]

networks:
  synora:
    driver: bridge

volumes:
  postgres_data:
  backups_data:
  minio_data:
  caddy_data:
  caddy_config: